name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

# If several merges land close together, only the newest one deploys.
concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_E7XvEbrVXVZGEPPj8dmhtESH
      VERCEL_PROJECT_ID: prj_1FivM66XbhyWMHJuYJaRayyuTbFt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Deploy to production
        run: npx --yes vercel@65.9.0 deploy --prod --yes
