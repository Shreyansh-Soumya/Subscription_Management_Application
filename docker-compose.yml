services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://brightloop:brightloop@postgres:5432/brightloop
      BETTER_AUTH_URL: http://localhost:${APP_PORT:-3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-only-not-a-real-secret}
    volumes:
      - .:/app
      # Kept inside Docker so they never mix with files built for your own operating system.
      - app-node-modules:/app/node_modules
      - app-next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop
      POSTGRES_DB: brightloop
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - brightloop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  app-node-modules:
  app-next:
  brightloop-postgres:
